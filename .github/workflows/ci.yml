name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Only what the unit tests need; the full requirements include torch and the 0G SDKs.
        run: pip install cryptography pytest
      - name: Syntax check
        run: python -m compileall -q backend/app backend/scripts
      - name: Unit tests
        run: python -m pytest -q backend/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile contracts
        run: npx -y solc@0.8.24 --bin --abi -o /tmp/solc-out --base-path . contracts/Veridata.sol contracts/VeridataPay.sol
      - name: Committed ABIs match the source
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          out = pathlib.Path("/tmp/solc-out")
          norm = lambda x: sorted(json.dumps(i, sort_keys=True) for i in x)
          ok = True
          for name in ("Veridata", "VeridataPay"):
              compiled = json.loads((out / f"contracts_{name}_sol_{name}.abi").read_text())
              for f in (f"contracts/{name}.abi.json", f"backend/app/chain/{name}.abi.json"):
                  committed = json.loads(pathlib.Path(f).read_text())
                  if isinstance(committed, dict):
                      committed = committed.get("abi", committed)
                  if norm(committed) != norm(compiled):
                      print(f"::error file={f}::ABI does not match contracts/{name}.sol; regenerate it")
                      ok = False
          sys.exit(0 if ok else 1)
          EOF
